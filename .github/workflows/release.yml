# Builds and tests anod + ano on every push and pull request, and publishes
# release channels that `anod/install.sh` downloads on machines without Go:
#   main   -> rolling "channel-stable" release (latest stable; marked Latest)
#   dev    -> rolling "channel-dev" pre-release (development builds)
#   v*     -> a pinned versioned release (vX.Y.Z)
# Rolling channels move their tag to the built commit and replace the assets.
# The tags are prefixed so none can share a name with a branch (a `dev` tag
# next to the `dev` branch makes `git checkout dev` ambiguous).
name: build and release

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One publish per channel at a time. Only pull-request runs are cancelled by
# a newer push: cancelling a release mid-upload could leave a channel without
# its tarball.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.channel.outputs.version }}
    defaults:
      run:
        working-directory: anod
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe for dev version strings

      - uses: actions/setup-go@v7
        with:
          go-version-file: anod/go.mod
          cache-dependency-path: anod/go.sum

      - name: pick the channel and version
        id: channel
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          base="$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/version/version.go)"
          sha="$(git rev-parse --short HEAD)"
          channel=none
          version="$base+$sha"
          if [ "$EVENT" = push ]; then
            case "$REF" in
              refs/tags/v*)      channel=tag;    version="${REF_NAME#v}" ;;
              refs/heads/main)   channel=stable; version="$base+main.$sha" ;;
              refs/heads/dev)    channel=dev;    version="$base-dev+$sha" ;;
            esac
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel $channel, version $version"

      - name: vet and test
        run: |
          go vet ./...
          go test ./...

      - name: cross-build release tarballs
        env:
          ANO_VERSION: ${{ steps.channel.outputs.version }}
        run: ./dist.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            anod/dist/anoshell-linux-*.tar.gz
            anod/dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.channel != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: move the rolling channel tag to this commit
        if: needs.build.outputs.channel != 'tag'
        env:
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          git tag -f "channel-$CHANNEL" "$GITHUB_SHA"
          git push -f origin "refs/tags/channel-$CHANNEL"

      - name: publish a versioned release
        if: needs.build.outputs.channel == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/anoshell-linux-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: "false" # "Latest" is the stable channel

      - name: publish the rolling channel
        if: needs.build.outputs.channel != 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: channel-${{ needs.build.outputs.channel }}
          name: ${{ needs.build.outputs.channel == 'stable' && 'Stable (main)' || 'Development (dev)' }}
          body: |
            Rolling ${{ needs.build.outputs.channel }} build of ${{ github.ref_name }} at ${{ github.sha }}.
            Version ${{ needs.build.outputs.version }}. Replaced on every push to ${{ github.ref_name }}.
          prerelease: ${{ needs.build.outputs.channel == 'dev' }}
          make_latest: ${{ needs.build.outputs.channel == 'stable' && 'true' || 'false' }}
          files: |
            dist/anoshell-linux-*.tar.gz
            dist/SHA256SUMS
          overwrite_files: true
          fail_on_unmatched_files: true
