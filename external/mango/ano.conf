# =============================================================================
# AnoShell — mango configuration (mango >= 0.18)
#
# Usage: copy or symlink this to ~/.config/mango/config.conf
#   cp ~/.config/quickshell/ano/external/mango/ano.conf ~/.config/mango/config.conf
#   — or —
#   ln -sf ~/.config/quickshell/ano/external/mango/ano.conf ~/.config/mango/config.conf
# Check it with `mango -p -c ~/.config/mango/config.conf`; SUPER+r reloads.
#
# All UI interactions (sidebars, overview, settings, OSD, notifications)
# go through QuickShell IPC: qs -c ano ipc call <target> <method>
# Settings → Keybinds doesn't edit this file: change the binds by hand.
# Docs: https://anoshell.anorebel.net (Compositors). Check what's installed
# with `ano doctor`.
#
# Your own settings: ~/.config/mango/local.conf (loaded last, optional).
# Reference: https://mangowm.github.io/docs/ (keyword names as in mango 0.18;
# newer docs write some differently, e.g. windowrule for window_rule).
# =============================================================================

# ─── Startup ─────────────────────────────────────────────────────────────────
# Legacy bars/notifiers out of the way, then the shell with more than the
# default 1024 open files (anod --supervise raises it itself).
exec_once=pkill -x waybar; pkill -x swaync; pkill -x swayosd; true
exec_once=ulimit -Sn 65536 2>/dev/null || ulimit -Sn $(ulimit -Hn); exec qs -c ano
# anod, the shell's companion daemon (docs/anod.md); skipped if not installed.
# For crash supervision, replace both lines with: anod --supervise (it starts qs).
exec_once=A=$(command -v anod || echo "$HOME/.local/bin/anod"); [ -x "$A" ] && exec "$A"
exec_once=systemctl --user start hyprpolkitagent
exec_once=nm-applet --indicator
# Clipboard history (with QS IPC update)
exec_once=wl-paste --type text --watch bash -c 'cliphist store && qs -c ano ipc call cliphistService update'
exec_once=wl-paste --type image --watch bash -c 'cliphist store && qs -c ano ipc call cliphistService update'
# Wallpaper: awww draws it; rotation, colours and hooks are anod's.
exec_once=awww-daemon
exec_once=kdeconnectd

# mango sets XDG_CURRENT_DESKTOP=mango and MANGO_INSTANCE_SIGNATURE itself;
# AnoShell picks its mango backend from them.
env=QT_QPA_PLATFORMTHEME,qt6ct
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=_JAVA_AWT_WM_NONREPARENTING,1
cursor_theme=Qogir
cursor_size=16

# ─── Input ───────────────────────────────────────────────────────────────────
xkb_rules_layout=us
numlock_on=1
tap_to_click=1
trackpad_natural_scrolling=1

# ─── Look ────────────────────────────────────────────────────────────────────
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
border_px=2
border_radius=8
blur=1
blur_layer=1
blur_optimized=1
shadows=1
layer_shadows=0
shadow_only_floating=1

# ─── Layer rules: AnoShell surfaces ──────────────────────────────────────────
# Same split as the bundled Hyprland config: translucent surfaces blur; opaque
# cards and surfaces that draw their own shapes don't (the blur can't be seen
# there and costs frames). AnoShell animates its own surfaces.
layer_rule=no_animation:1,no_shadow:1,layer_name:^quickshell
# (mango reads at most 255 bytes per line, hence three rules)
layer_rule=no_blur:1,layer_name:^quickshell:(anoScreen|notifPopup|polkitPlain|controlPanel|networkOrbit|media|hud|weather|calendar|cheatsheet|wallpaper|clipboard)$
layer_rule=no_blur:1,layer_name:^quickshell:(search|settings|osd|altSwitcher|taskview|anoview|session|lock|recordingOsd|familyTransition|frameExclusion|freeze|dropProbe)$
layer_rule=no_blur:1,layer_name:^quickshell:anospot:(edgePicker|peek|wspreview|stash)$
layer_rule=no_animation:1,no_blur:1,layer_name:selection

# ─── Window rules ────────────────────────────────────────────────────────────
# Dropdown terminal (Super+Shift+T): floating at the defaults of Settings →
# Modules → Dropdown terminal, against the top edge (offset_y -100); the shell
# hides and shows it. Change width/height/offset_x/offset_y for another place.
window_rule=is_floating:1,width:0.75,height:0.6,offset_y:-100,app_id:^ano\.dropterm$
window_rule=is_floating:1,app_id:^(pavucontrol|org\.pulseaudio\.pavucontrol|blueman-manager|nm-connection-editor)$

# ─── Key bindings ────────────────────────────────────────────────────────────
# Key names as `wev` prints them; mods: super, ctrl, alt, shift, none.

# AnoShell UI (via IPC)
bind=SUPER,a,spawn,qs -c ano ipc call search toggle || pkill rofi || rofi -show drun -show-icons
bind=SUPER,Tab,spawn,qs -c ano ipc call anoview toggle
bind=SUPER,grave,spawn,qs -c ano ipc call taskView toggle
bind=SUPER+SHIFT,t,spawn,qs -c ano ipc call dropTerminal toggle
bind=SUPER,b,spawn,qs -c ano ipc call sidebarLeft toggle
bind=SUPER,n,spawn,qs -c ano ipc call sidebarRight toggle
bind=SUPER,i,spawn,qs -c ano ipc call controlPanel toggle
bind=SUPER,comma,spawn,qs -c ano ipc call settings toggle
bind=SUPER+SHIFT,i,spawn,qs -c ano ipc call hud toggle
bind=ALT,v,spawn,qs -c ano ipc call clipboard toggle
bind=SUPER,slash,spawn,qs -c ano ipc call cheatsheet toggle
bind=SUPER,o,spawn,qs -c ano ipc call mediaControls toggle
bind=SUPER,x,spawn,qs -c ano ipc call session toggle
bind=SUPER+SHIFT,b,spawn,qs -c ano ipc call bar toggle
bind=SUPER+CTRL,t,spawn,qs -c ano ipc call wallpaperSelector toggle
bind=SUPER+CTRL,n,spawn,qs -c ano ipc call reader toggle novel
bind=SUPER+CTRL,m,spawn,qs -c ano ipc call reader toggle manga
bind=SUPER+CTRL,a,spawn,qs -c ano ipc call reader toggle anime
bind=SUPER+SHIFT,w,spawn,qs -c ano ipc call weatherPanel toggle
bind=SUPER+SHIFT,d,spawn,qs -c ano ipc call dock toggle
bind=SUPER+SHIFT,f,spawn,qs -c ano ipc call focusTime toggle
bind=SUPER,l,spawn,qs -c ano ipc call lock lock
bind=SUPER+CTRL,p,spawn,qs -c ano ipc call panelFamily cycle
bind=SUPER+CTRL,r,spawn,killall qs quickshell; sleep 0.3; qs -c ano
bind=SUPER,r,reload_config

# Screenshots (AnoShell's capture; grim fallbacks)
bind=SUPER+SHIFT,s,spawn,qs -c ano ipc call screenshot region || grim -g "$(slurp)" - | wl-copy
bind=SUPER+SHIFT,x,spawn,qs -c ano ipc call screenshot ocr
bind=NONE,Print,spawn,qs -c ano ipc call screenshot screen || grim - | wl-copy
bind=SHIFT,Print,spawn,grim -g "$(slurp)" - | swappy -f -
bind=SUPER+SHIFT,c,spawn,hyprpicker -a && notify-send 'Color picked' "$(wl-paste)"

# Volume, brightness, media (through the shell so its OSD shows)
bind=NONE,XF86AudioRaiseVolume,spawn,qs -c ano ipc call audio increment || wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5
bind=NONE,XF86AudioLowerVolume,spawn,qs -c ano ipc call audio decrement || wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind=NONE,XF86AudioMute,spawn,qs -c ano ipc call audio toggleMute || wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,qs -c ano ipc call audio toggleMicMute || wpctl set-mute @DEFAULT_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,qs -c ano ipc call brightness increment || brightnessctl s 5%+
bind=NONE,XF86MonBrightnessDown,spawn,qs -c ano ipc call brightness decrement || brightnessctl s 5%-
bind=NONE,XF86KbdBrightnessUp,spawn,brightnessctl -d '*::kbd_backlight' s 10%+
bind=NONE,XF86KbdBrightnessDown,spawn,brightnessctl -d '*::kbd_backlight' s 10%-
bind=NONE,XF86AudioPlay,spawn,qs -c ano ipc call mpris playPause || playerctl play-pause
bind=NONE,XF86AudioNext,spawn,qs -c ano ipc call mpris next || playerctl next
bind=NONE,XF86AudioPrev,spawn,qs -c ano ipc call mpris previous || playerctl previous
bind=NONE,XF86AudioStop,spawn,qs -c ano ipc call mpris pauseAll || playerctl stop
bind=SUPER+SHIFT,p,spawn,qs -c ano ipc call mpris playPause || playerctl play-pause
bind=SUPER+SHIFT,n,spawn,qs -c ano ipc call mpris next || playerctl next

# Apps (default apps go through `ano run`, apps.* in Settings)
bind=SUPER,Return,spawn,ano run terminal
bind=SUPER,e,spawn,ano run files ~/Downloads
bind=SUPER,z,spawn,ano run browser
bind=SUPER,d,spawn,vicinae toggle
bind=SUPER,period,spawn,wofi-emoji
bind=CTRL+ALT,u,spawn,pavucontrol
bind=SUPER+SHIFT,l,spawn,systemctl suspend || loginctl suspend

# Windows
bind=SUPER+SHIFT,q,killclient,
bind=SUPER+CTRL,q,quit
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+ALT,f,togglefullscreen,
bind=SUPER,space,togglefloating,
bind=SUPER,p,toggleglobal,
bind=SUPER,m,minimized,
bind=SUPER+SHIFT,m,restore_minimized
bind=SUPER,w,switch_layout

# Focus and move
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,semicolon,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+CTRL,Left,resizewin,-50,+0
bind=SUPER+CTRL,Right,resizewin,+50,+0
bind=SUPER+CTRL,Up,resizewin,+0,-50
bind=SUPER+CTRL,Down,resizewin,+0,+50

# Tags (mango's workspaces: per monitor, 1–9)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=ALT,Tab,viewtoright_have_client,0
bind=ALT+SHIFT,Tab,viewtoleft_have_client,0
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# Scratchpad
bind=SUPER+SHIFT,grave,toggle_scratchpad

# Mouse, wheel and gestures
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

source_optional=~/.config/mango/local.conf
