# =============================================================================
# AnoShell — sway configuration (sway >= 1.12)
#
# Usage: copy or symlink this to ~/.config/sway/config
#   cp ~/.config/quickshell/ano/external/sway/ano.conf ~/.config/sway/config
#   — or —
#   ln -sf ~/.config/quickshell/ano/external/sway/ano.conf ~/.config/sway/config
# Check it with `sway -C -c ~/.config/sway/config`; $mod+Shift+r reloads.
#
# All UI interactions (sidebars, overview, settings, OSD, notifications)
# go through QuickShell IPC: qs -c ano ipc call <target> <method>
# Settings → Keybinds doesn't edit this file: change the binds by hand.
# Docs: https://anoshell.anorebel.net (Compositors). Check what's installed
# with `ano doctor`. Sway has no blur (SwayFX does; its layer_effects would go
# in your local file).
#
# Your own settings: ~/.config/sway/local.conf (loaded last, optional).
# Reference: man 5 sway
# =============================================================================

set $mod Mod4
set $ipc qs -c ano ipc call

# The distribution's snippets: among them the one that hands WAYLAND_DISPLAY
# and friends to systemd and D-Bus, which portals (file pickers, screen
# sharing) need.
include /etc/sway/config.d/*

# ─── Startup ─────────────────────────────────────────────────────────────────
# Legacy bars/notifiers out of the way, then the shell with more than the
# default 1024 open files (anod --supervise raises it itself).
exec pkill -x waybar; pkill -x swaync; pkill -x swayosd; true
exec ulimit -Sn 65536 2>/dev/null || ulimit -Sn $(ulimit -Hn); exec qs -c ano
# anod, the shell's companion daemon (docs/anod.md); skipped if not installed.
# For crash supervision, replace both lines with: anod --supervise (it starts qs).
exec A=$(command -v anod || echo "$HOME/.local/bin/anod"); [ -x "$A" ] && exec "$A"
exec systemctl --user start hyprpolkitagent
exec nm-applet --indicator
# Clipboard history (with QS IPC update)
exec wl-paste --type text --watch bash -c 'cliphist store && qs -c ano ipc call cliphistService update'
exec wl-paste --type image --watch bash -c 'cliphist store && qs -c ano ipc call cliphistService update'
# Wallpaper: awww draws it; rotation, colours and hooks are anod's.
exec awww-daemon
exec kdeconnectd

# ─── Input & look ────────────────────────────────────────────────────────────
input type:keyboard {
    xkb_layout us
    xkb_numlock enabled
}
input type:touchpad {
    tap enabled
    natural_scroll enabled
}
seat seat0 xcursor_theme Qogir 16

default_border pixel 2
default_floating_border pixel 2
gaps inner 5
gaps outer 5
focus_follows_mouse yes

# ─── Window rules ────────────────────────────────────────────────────────────
# Dropdown terminal (Super+Shift+T): floating; the shell sizes it, places it
# against dropTerminal.side and keeps it in the scratchpad while hidden.
for_window [app_id="^ano\.dropterm$"] floating enable
for_window [app_id="^(pavucontrol|org\.pulseaudio\.pavucontrol|blueman-manager|nm-connection-editor)$"] floating enable

# ─── Key bindings ────────────────────────────────────────────────────────────

# AnoShell UI (via IPC)
bindsym --release Super_L exec $ipc search toggle || pkill rofi || rofi -show drun -show-icons
bindsym $mod+Tab exec $ipc anoview toggle
bindsym $mod+grave exec $ipc taskView toggle
bindsym $mod+Shift+t exec $ipc dropTerminal toggle
bindsym $mod+b exec $ipc sidebarLeft toggle
bindsym $mod+n exec $ipc sidebarRight toggle
bindsym $mod+a exec $ipc search toggle
bindsym $mod+i exec $ipc controlPanel toggle
bindsym $mod+comma exec $ipc settings toggle
bindsym $mod+Shift+i exec $ipc hud toggle
bindsym Mod1+v exec $ipc clipboard toggle
bindsym $mod+slash exec $ipc cheatsheet toggle
bindsym $mod+o exec $ipc mediaControls toggle
bindsym $mod+x exec $ipc session toggle
bindsym $mod+Shift+b exec $ipc bar toggle
bindsym $mod+Ctrl+t exec $ipc wallpaperSelector toggle
bindsym $mod+Ctrl+n exec $ipc reader toggle novel
bindsym $mod+Ctrl+m exec $ipc reader toggle manga
bindsym $mod+Ctrl+a exec $ipc reader toggle anime
bindsym $mod+Shift+w exec $ipc weatherPanel toggle
bindsym $mod+Shift+d exec $ipc dock toggle
bindsym $mod+Shift+f exec $ipc focusTime toggle
bindsym $mod+l exec $ipc lock lock
bindsym $mod+Ctrl+p exec $ipc panelFamily cycle
bindsym $mod+Ctrl+r exec killall qs quickshell; sleep 0.3; qs -c ano
bindsym $mod+Shift+r reload

# Screenshots (AnoShell's capture; grim fallbacks)
bindsym $mod+Shift+s exec $ipc screenshot region || grim -g "$(slurp)" - | wl-copy
bindsym $mod+Shift+x exec $ipc screenshot ocr
bindsym Print exec $ipc screenshot screen || grim - | wl-copy
bindsym Shift+Print exec grim -g "$(slurp)" - | swappy -f -
bindsym $mod+Shift+c exec hyprpicker -a && notify-send 'Color picked' "$(wl-paste)"

# Volume, brightness, media (through the shell so its OSD shows)
bindsym --locked XF86AudioRaiseVolume exec $ipc audio increment || wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5
bindsym --locked XF86AudioLowerVolume exec $ipc audio decrement || wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindsym --locked XF86AudioMute exec $ipc audio toggleMute || wpctl set-mute @DEFAULT_SINK@ toggle
bindsym --locked XF86AudioMicMute exec $ipc audio toggleMicMute || wpctl set-mute @DEFAULT_SOURCE@ toggle
bindsym --locked XF86MonBrightnessUp exec $ipc brightness increment || brightnessctl s 5%+
bindsym --locked XF86MonBrightnessDown exec $ipc brightness decrement || brightnessctl s 5%-
bindsym XF86KbdBrightnessUp exec brightnessctl -d '*::kbd_backlight' s 10%+
bindsym XF86KbdBrightnessDown exec brightnessctl -d '*::kbd_backlight' s 10%-
bindsym --locked XF86AudioPlay exec $ipc mpris playPause || playerctl play-pause
bindsym --locked XF86AudioNext exec $ipc mpris next || playerctl next
bindsym --locked XF86AudioPrev exec $ipc mpris previous || playerctl previous
bindsym --locked XF86AudioStop exec $ipc mpris pauseAll || playerctl stop
bindsym $mod+Shift+p exec $ipc mpris playPause || playerctl play-pause
bindsym $mod+Shift+n exec $ipc mpris next || playerctl next

# Apps (default apps go through `ano run`, apps.* in Settings)
bindsym $mod+Return exec ano run terminal
bindsym $mod+e exec ano run files ~/Downloads
bindsym $mod+z exec ano run browser
bindsym $mod+d exec vicinae toggle
bindsym $mod+period exec wofi-emoji
bindsym Ctrl+Mod1+u exec pavucontrol
bindsym $mod+Shift+l exec systemctl suspend || loginctl suspend

# Windows
bindsym $mod+Shift+q kill
bindsym $mod+Ctrl+q exec $ipc session toggle || swaymsg exit
bindsym $mod+f fullscreen toggle
bindsym $mod+space floating toggle
bindsym $mod+Shift+space focus mode_toggle
bindsym $mod+p sticky toggle
bindsym $mod+w layout toggle tabbed split
bindsym $mod+v splitv
bindsym $mod+Shift+v splith
floating_modifier $mod normal

# Focus and move
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+h focus left
bindsym $mod+semicolon focus right
bindsym $mod+k focus up
bindsym $mod+j focus down
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+h move left
bindsym $mod+Shift+semicolon move right
bindsym $mod+Shift+k move up
bindsym $mod+Shift+j move down
bindsym $mod+Ctrl+Left resize shrink width 40px
bindsym $mod+Ctrl+Right resize grow width 40px
bindsym $mod+Ctrl+Up resize shrink height 40px
bindsym $mod+Ctrl+Down resize grow height 40px

# Workspaces (numbered across outputs)
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10
bindsym Mod1+Tab workspace next_on_output
bindsym Mod1+Shift+Tab workspace prev_on_output
bindsym --whole-window $mod+button4 workspace prev_on_output
bindsym --whole-window $mod+button5 workspace next_on_output

# Scratchpad
bindsym $mod+Shift+grave move scratchpad
bindsym $mod+Ctrl+grave scratchpad show

include ~/.config/sway/local.conf
